services:
  - type: web
    name: crowdpulse-backend
    env: node
    plan: free
    buildCommand: npm install && npm run install:all && npm run build:prod
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_URI
        value: "mongodb+srv://username:password@cluster.mongodb.net/crowdpulse?retryWrites=true&w=majority"
